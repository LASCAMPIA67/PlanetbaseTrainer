version: 2

# Dependabot can only reach nuget.org unless other feeds are declared here. The BepInEx feed (see NuGet.Config) is
# public and needs no credentials, but without it Dependabot can't restore the solution at all.
registries:
  bepinex:
    type: nuget-feed
    url: https://nuget.bepinex.dev/v3/index.json

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directory: /
    registries:
      - bepinex
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      # Compile-time references that must match what BepInEx 5.4.23.5 provides at runtime.
      - dependency-name: BepInEx.*
      - dependency-name: HarmonyX
    commit-message:
      prefix: build
