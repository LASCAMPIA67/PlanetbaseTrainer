# Checks everything that can be checked without the game. The plugin itself compiles against the game's assemblies,
# which can't be redistributed: it is built and tested locally (see CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: C# formatting and patch verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check C# formatting
        run: dotnet format whitespace --folder --verify-no-changes --exclude "**/obj/**" "**/bin/**"

      # Locked-mode restore (see Directory.Build.props). Warnings fail the build, NuGet vulnerability audits included.
      - name: Build the patch verifier
        run: dotnet build tests/PatchVerifier/PatchVerifier.csproj --configuration Release -warnaserror

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  powershell:
    name: PowerShell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path tools -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Output
          if ($results) {
              throw "PSScriptAnalyzer reported $(@($results).Count) issue(s)."
          }
